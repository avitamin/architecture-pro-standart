<text x="526" y="715" font-size="16" font-weight="400" fill="#1a3445" text-anchor="start">¹ Для MVP предполагается, что общие ставки публикует депозитный бэк-офис.</text>
<text x="526" y="746" font-size="15" font-weight="400" fill="#445b69" text-anchor="start">Связи с CRM и АБС показывают назначение сообщений. Передача через Kafka раскрыта на уровне контейнеров.</text>
