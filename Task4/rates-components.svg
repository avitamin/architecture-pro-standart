<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="585" viewBox="0 0 1370 585" role="img">
  <title>От события публикации до готового CSV</title>
  <desc>C4 · Компоненты банковского обработчика выгрузки. Одна версия обозначает один неизменяемый полный набор.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#476776" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1370" height="585" fill="#ffffff" />
  <text x="32" y="46" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start" font-weight="bold" fill="#1c3546">От события публикации до готового CSV</text>
  <text x="32" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#1c3546">C4 · Компоненты банковского обработчика выгрузки. Одна версия обозначает один неизменяемый полный набор.</text>
  <rect x="300" y="147" width="1025" height="222" rx="14" fill="#f6f9fa" stroke="#849ba5" stroke-width="1.5" stroke-dasharray="7 5" />
  <text x="316" y="171" font-family="DejaVu Sans, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1c3546">Контейнер  /  банковский обработчик выгрузки</text>
  <rect x="28" y="210" width="215" height="106" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="135.5" y="232" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Внешний к контейнеру</text>
  <text x="135.5" y="259" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Kafka</text>
  <text x="135.5" y="284" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Событие с версией</text>
  <text x="135.5" y="304" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">и общими ставками</text>
  <rect x="325" y="210" width="257" height="106" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="453.5" y="232" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Компонент</text>
  <text x="453.5" y="259" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#183546">Потребитель Kafka</text>
  <text x="453.5" y="284" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Читает событие и управляет</text>
  <text x="453.5" y="304" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">повтором обработки</text>
  <rect x="677" y="210" width="235" height="106" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="794.5" y="232" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Компонент</text>
  <text x="794.5" y="259" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Формирование CSV</text>
  <text x="794.5" y="284" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Кодирует версию, ставки</text>
  <text x="794.5" y="304" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">и периоды действия</text>
  <rect x="1007" y="210" width="286" height="106" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="1150.0" y="232" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Компонент</text>
  <text x="1150.0" y="259" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Доставка по SFTP</text>
  <text x="1150.0" y="284" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Загружает временный файл</text>
  <text x="1150.0" y="304" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">и публикует конечное имя</text>
  <rect x="970" y="447" width="355" height="100" rx="10" fill="#fbefdb" stroke="#a78447" stroke-width="1.6" />
  <text x="1147.5" y="469" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Внешняя система</text>
  <text x="1147.5" y="496" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Система партнёра</text>
  <text x="1147.5" y="521" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Импортирует завершённые файлы</text>
  <polyline points="243,263 325,263" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="284" y="247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Событие</text>
  <polyline points="582,263 677,263" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="630" y="247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Снимок</text>
  <polyline points="912,263 1007,263" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="960" y="247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">CSV</text>
  <polyline points="1160,316 1160,447" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="1217" y="394" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Передаёт файл</text>
  <text x="32" y="450" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#1c3546">После отправки</text>
  <text x="32" y="483" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#1c3546">Потребитель фиксирует позицию в Kafka после успешной передачи файла.</text>
  <text x="32" y="510" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#1c3546">Версию, которую импортировал партнёр, можно сверить по его журналу.</text>
</svg>