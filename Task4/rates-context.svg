<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="655" viewBox="0 0 1310 655" role="img">
  <title>Консультация по депозитным ставкам</title>
  <desc>C4 · Контекст интернет-банка. Стрелка показывает, кто выполняет подписанное действие.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#476776" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1310" height="655" fill="#ffffff" />
  <text x="32" y="46" font-family="DejaVu Sans, sans-serif" font-size="30" text-anchor="start" font-weight="bold" fill="#1c3546">Консультация по депозитным ставкам</text>
  <text x="32" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#1c3546">C4 · Контекст интернет-банка. Стрелка показывает, кто выполняет подписанное действие.</text>
  <rect x="40" y="140" width="300" height="94" rx="10" fill="#edf1e9" stroke="#7b916b" stroke-width="1.6" />
  <text x="190.0" y="162" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Сотрудники банка</text>
  <text x="190.0" y="189" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Бэк-офисы</text>
  <text x="190.0" y="214" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Рассчитывают и утверждают ставки</text>
  <rect x="40" y="345" width="300" height="106" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="190.0" y="367" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Банковская система</text>
  <text x="190.0" y="394" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">АБС</text>
  <text x="190.0" y="419" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Публикует утверждённые условия</text>
  <text x="190.0" y="439" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">и сроки их действия</text>
  <rect x="475" y="325" width="350" height="135" rx="10" fill="#194d66" stroke="#194d66" stroke-width="1.6" />
  <text x="650.0" y="347" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#ffffff">Банковская система в фокусе</text>
  <text x="650.0" y="374" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">Интернет-банк</text>
  <text x="650.0" y="399" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#ffffff">Предоставляет общий каталог</text>
  <text x="650.0" y="419" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#ffffff">и отправляет опубликованные</text>
  <text x="650.0" y="439" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#ffffff">условия партнёру</text>
  <rect x="970" y="200" width="300" height="100" rx="10" fill="#e7f1f6" stroke="#497691" stroke-width="1.6" />
  <text x="1120.0" y="222" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Банковская система</text>
  <text x="1120.0" y="249" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">CRM кол-центра</text>
  <text x="1120.0" y="274" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Показывает текущие условия</text>
  <rect x="970" y="470" width="300" height="100" rx="10" fill="#fbefdb" stroke="#a78447" stroke-width="1.6" />
  <text x="1120.0" y="492" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Внешняя система</text>
  <text x="1120.0" y="519" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Система партнёра</text>
  <text x="1120.0" y="544" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Загружает файл общих ставок</text>
  <rect x="970" y="98" width="300" height="76" rx="10" fill="#edf1e9" stroke="#7b916b" stroke-width="1.6" />
  <text x="1120.0" y="120" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Сотрудник банка</text>
  <text x="1120.0" y="147" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Оператор банка</text>
  <rect x="475" y="525" width="350" height="90" rx="10" fill="#edf1e9" stroke="#7b916b" stroke-width="1.6" />
  <text x="650.0" y="547" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#183546">Сотрудник партнёра</text>
  <text x="650.0" y="574" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#183546">Оператор партнёра</text>
  <text x="650.0" y="599" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#183546">Консультирует по загруженным ставкам</text>
  <polyline points="190,234 190,345" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="254" y="279" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Импортируют</text>
  <text x="254" y="297" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">и публикуют</text>
  <polyline points="340,398 475,398" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="407" y="367" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Передаёт версию</text>
  <text x="407" y="385" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">общих условий</text>
  <polyline points="970,247 895,247 895,351 825,351" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="843" y="215" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Запрашивает</text>
  <text x="843" y="233" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">общие ставки</text>
  <polyline points="825,419 906,419 906,502 970,502" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="914" y="386" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Отправляет</text>
  <text x="914" y="404" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">файл ставок</text>
  <polyline points="1120,174 1120,200" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="1193" y="190" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Открывает CRM</text>
  <polyline points="825,555 970,555" fill="none" stroke="#476776" stroke-width="2" marker-end="url(#a)" />
  <text x="899" y="524" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">Смотрит</text>
  <text x="899" y="542" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c3546">ставку</text>
</svg>